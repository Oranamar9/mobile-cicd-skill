# Generated by @@generator@@. Settings: .github/mobile-cicd/config.json
# Secrets in the git history, vulnerable dependencies and risky code patterns. Runs on every push
# and pull request to main, every Monday, and as a gate before every store release.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # every Monday, 09:00 UTC
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The Gitleaks CLI, checksum-verified, rather than gitleaks-action: the action scans only the
      # pushed commits (nothing at all on a tag push) and asks organisations for a license. This
      # scans the whole history every time. A .gitleaks.toml in the repo root is picked up.
      - name: Install Gitleaks
        run: |
          cd "$RUNNER_TEMP"
          TAR="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TAR}"
          echo "${GITLEAKS_SHA256}  ${TAR}" | sha256sum --check --strict
          tar -xzf "$TAR" gitleaks

      - name: Scan the whole history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  dependency-audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

# @if isPnpm
      - uses: pnpm/action-setup@v4
# @if pnpmVersion
        with:
          version: @@pnpmVersion@@
# @endif

# @endif
# @if isYarnBerry
      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

# @endif
      - uses: actions/setup-node@v7
        with:
          node-version: '@@nodeVersion@@'

      # Reads the lockfile only: no install, so no install scripts run here.
      - name: Audit the production dependencies
        run: @@pm.audit@@

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Semgrep
        run: pipx install semgrep

      # Community rules picked for the languages in the repo; only findings marked ERROR fail.
      - name: Scan
        run: semgrep scan --config=auto --severity=ERROR --error .
