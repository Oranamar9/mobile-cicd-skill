# Generated by @@generator@@. Settings: .github/mobile-cicd/config.json
# Lint, types, tests and build on every push and pull request to main. mobile-release.yml runs
# it again as a gate, so nothing reaches the stores without passing it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run; runs on main and releases always finish.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

# @if isPnpm
      - uses: pnpm/action-setup@v4
# @if pnpmVersion
        with:
          version: @@pnpmVersion@@
# @endif

# @endif
# @if isYarnBerry
      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

# @endif
      - uses: actions/setup-node@v7
        with:
          node-version: '@@nodeVersion@@'
          cache: @@pm.cache@@

      - name: Install dependencies
        run: |
          @@pm.install@@
# @if hooks.afterInstall

      - name: After install (project hook)
        run: |
          @@hooks.afterInstall@@
# @endif
# @if ci.lint

      - name: Lint
        run: |
          @@ci.lint@@
# @endif
# @if ci.format

      - name: Format check
        run: |
          @@ci.format@@
# @endif
# @if ci.typecheck

      - name: Type check
        run: |
          @@ci.typecheck@@
# @endif
# @if ci.test

      - name: Tests
        run: |
          @@ci.test@@
# @endif
# @if ci.build

      - name: Build
        run: |
          @@ci.build@@
# @endif
