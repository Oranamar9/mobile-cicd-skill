# Generated by @@generator@@. Settings: .github/mobile-cicd/config.json
#
# Ships a version to production on the App Store and Google Play:
#
#   git tag -a v1.2.3 -m "What's new in this version"   (on a commit that is in main)
#   git push origin v1.2.3
#
# The tag message becomes the App Store "What's New" text. CI and Security run again as gates,
# both stores are asked for their latest build number (+1, so no number is ever reused), then
# iOS and Android build, sign and upload in parallel. Secrets and the one-time store setup:
# .github/mobile-cicd/README.md
#
# How the store secrets are kept away from the app's dependencies:
#
#   - The jobs that install dependencies and build (ios-build, android-build) run code from
#     hundreds of packages: install scripts, Expo config plugins, CocoaPods and Gradle plugins.
#     None of them sees the App Store Connect key, the Play key or the Android upload key.
#   - Signing (Android) and uploading (both) happen in separate jobs on fresh runners that only
#     run fastlane (pinned by Gemfile.lock) and the JDK's own tools.
#   - iOS signs inside Xcode, so ios-build imports the distribution certificate before any
#     dependency code runs, as a non-extractable key: build code can sign with it during the job
#     but cannot copy it out.
#   - Every secret is given to the one step that needs it (never to a whole job), every action is
#     pinned to a commit, and no secret is ever put on a command line.
#
# .github/mobile-cicd/check-workflow-secrets.mjs checks all of this. It runs in CI and in the
# gate below, so a later edit that breaks one of these rules stops the release.
name: Mobile Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  # One release at a time: two runs must never pick the same build number.
  group: mobile-release
  cancel-in-progress: false

env:
  # What "production" means. Change these here; no other file needs to change.
  IOS_SUBMIT_FOR_REVIEW: '@@release.iosSubmitForReviewText@@'  # 'true': submit for App Review after the upload. 'false': upload only, submit by hand in App Store Connect.
  IOS_AUTOMATIC_RELEASE: '@@release.iosAutomaticReleaseText@@'  # 'true': goes live as soon as Apple approves. 'false': you press "Release" in App Store Connect.
  ANDROID_ROLLOUT: '@@release.androidRolloutText@@'          # 1.0: everyone at once. 0.2: staged rollout to 20%, raised by hand in Play Console.

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag must be vX.Y.Z
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: The tag must point at a commit in main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Tag a commit that is in main, then push the tag again."
            exit 1
          fi

      - name: Store secrets stay away from build code
        run: node .github/mobile-cicd/check-workflow-secrets.mjs

  ci:
    name: CI
    needs: gate
    uses: ./.github/workflows/ci.yml

  security:
    name: Security
    needs: gate
    uses: ./.github/workflows/security.yml

  resolve:
    name: Next build number
    needs: [gate, ci, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_number: ${{ steps.next.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '@@rubyVersion@@'
          bundler-cache: true

      # The highest build number either store has seen, plus one. Nothing is committed back.
      - name: Ask both stores for their latest build number
        id: next
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane next_build_number

  # Builds and signs the .ipa. Everything that needs a store secret happens in "Prepare signing",
  # before the first step that runs dependency code; the steps after it get no secrets at all.
  ios-build:
    name: iOS build
    needs: [gate, resolve]
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
      # CocoaPods fails without a UTF-8 locale.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No bundler cache in this job: build code runs here later and could tamper with the gems
      # before the cache is saved, and the upload jobs restore that cache with the secrets loaded.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '@@rubyVersion@@'
          bundler-cache: false

      - name: Install fastlane
        run: bundle install --jobs 4

      # A temporary keychain with the certificate as a non-extractable key, and the App Store
      # profile (from IOS_PROVISIONING_PROFILE, or fetched with the API key). The secrets exist
      # only inside this step; it leaves no secret file behind.
      - name: Prepare signing
        id: signing
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: bundle exec fastlane ios prepare_signing

      # ---- From here on, dependency code runs. No step below gets a secret. ----

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version
# @if isPnpm

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
# @if pnpmVersion
        with:
          version: @@pnpmVersion@@
# @endif
# @endif
# @if isYarnBerry

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable
# @endif

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '@@nodeVersion@@'
          cache: @@pm.cache@@

      - name: Install dependencies
        run: |
          @@pm.install@@
# @if hooks.afterInstall

      - name: After install (project hook)
        run: |
          @@hooks.afterInstall@@
# @endif
# @if env

      # Build configuration, not a credential: everything in @@envFile@@ ends up inside the app.
      - name: Write @@envFile@@ from the @@envSecret@@ secret
        env:
          BUILD_ENV: ${{ secrets.@@envSecret@@ }}
        run: |
          if [[ -z "$BUILD_ENV" ]]; then echo "::error::The @@envSecret@@ secret is empty. Run .github/mobile-cicd/setup-secrets.sh env"; exit 1; fi
          printf '%s\n' "$BUILD_ENV" > @@sh:envFile@@
# @endif
# @if firebaseIos

      - name: Write GoogleService-Info.plist from its secret
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          mkdir -p "$(dirname @@sh:firebaseIos@@)"
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > @@sh:firebaseIos@@
# @endif

      - name: Set version ${{ needs.gate.outputs.version }} (${{ needs.resolve.outputs.build_number }})
        run: node .github/mobile-cicd/set-versions.mjs --platform ios --version "$VERSION" --build "$BUILD_NUMBER"
# @if isCapacitor

      - name: Build the web app and copy it into the iOS project
        run: |
          @@web.buildCommand@@
          npx cap sync ios
# @elif isPrebuild

      # NODE_ENV=production makes Expo read @@envFile@@ while it generates the project.
      - name: Generate the iOS project (expo prebuild)
        run: NODE_ENV=production npx expo prebuild --platform ios --clean --no-install

      - name: Install pods
        working-directory: ios
        run: @@ios.podInstall@@
# @elif ios.podInstall

      - name: Install pods
        working-directory: ios
        run: @@ios.podInstall@@
# @endif

      # Signs with the keychain from "Prepare signing". The lane refuses to start if any store
      # secret is in its environment.
      - name: Build and sign the .ipa
        env:
          IOS_PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: bundle exec fastlane ios build

      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain mobile-cicd.keychain || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-${{ needs.resolve.outputs.build_number }}
          path: build/ios/app.ipa
          retention-days: 14
          if-no-files-found: error

  # A fresh runner: nothing from ios-build runs here, only fastlane with the API key.
  ios-upload:
    name: iOS -> App Store Connect
    needs: [gate, resolve, ios-build]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '@@rubyVersion@@'
          bundler-cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-${{ needs.resolve.outputs.build_number }}
          path: build/ios

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane ios upload

  # Waiting for Apple to process the build takes 5-30 minutes. It runs on Linux, where a minute
  # costs a tenth of a macOS minute in private repos.
  ios-submit:
    name: iOS -> App Review
    needs: [gate, resolve, ios-upload]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
    steps:
      # Credentials kept: the lane fetches the annotated tag for its "What's New" text.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '@@rubyVersion@@'
          bundler-cache: true

      - name: Wait for processing, then submit for review
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane ios submit

  # Builds the bundle with no secrets at all. It is signed with a throwaway key made in this job
  # (so the project's own signing config, if any, doesn't matter); android-release replaces that
  # signature with the upload key.
  android-build:
    name: Android build
    needs: [gate, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
# @if isPnpm

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
# @if pnpmVersion
        with:
          version: @@pnpmVersion@@
# @endif
# @endif
# @if isYarnBerry

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable
# @endif

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '@@nodeVersion@@'
          cache: @@pm.cache@@

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '@@javaVersion@@'

      - name: Install dependencies
        run: |
          @@pm.install@@
# @if hooks.afterInstall

      - name: After install (project hook)
        run: |
          @@hooks.afterInstall@@
# @endif
# @if env

      # Build configuration, not a credential: everything in @@envFile@@ ends up inside the app.
      - name: Write @@envFile@@ from the @@envSecret@@ secret
        env:
          BUILD_ENV: ${{ secrets.@@envSecret@@ }}
        run: |
          if [[ -z "$BUILD_ENV" ]]; then echo "::error::The @@envSecret@@ secret is empty. Run .github/mobile-cicd/setup-secrets.sh env"; exit 1; fi
          printf '%s\n' "$BUILD_ENV" > @@sh:envFile@@
# @endif
# @if firebaseAndroid

      - name: Write google-services.json from its secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p "$(dirname @@sh:firebaseAndroid@@)"
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > @@sh:firebaseAndroid@@
# @endif

      - name: Set version ${{ needs.gate.outputs.version }} (${{ needs.resolve.outputs.build_number }})
        run: node .github/mobile-cicd/set-versions.mjs --platform android --version "$VERSION" --build "$BUILD_NUMBER"
# @if isCapacitor

      - name: Build the web app and copy it into the Android project
        run: |
          @@web.buildCommand@@
          npx cap sync android
# @elif isPrebuild

      # NODE_ENV=production makes Expo read @@envFile@@ while it generates the project.
      - name: Generate the Android project (expo prebuild)
        run: NODE_ENV=production npx expo prebuild --platform android --clean --no-install
# @endif

      - name: Restore the Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('@@pm.lockfile@@', '@@android.dir@@/**/*.gradle*', '@@android.dir@@/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
# @if isReactNative

      # Most of a React Native build is C++. ccache keeps the compiled objects between runs.
      - name: Install ccache
        run: sudo apt-get install -y --no-install-recommends ccache

      - name: Restore the C++ cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-
# @endif

      # The throwaway key goes in through android.injected.signing.* (the properties Android
      # Studio's "Generate Signed Bundle" uses), which win over any signing config in the project.
      # Its password is random and protects nothing, so passing it to Gradle is fine.
      - name: Build the bundle
        working-directory: @@android.dir@@
# @if isReactNative
        env:
          CCACHE_MAXSIZE: 2G
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
# @endif
        run: |
          throwaway_pw="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.keystore" -storetype PKCS12 -alias throwaway \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=throwaway" \
            -storepass "$throwaway_pw" -keypass "$throwaway_pw" >/dev/null
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
# @if android.reactNativeArchitectures
            -PreactNativeArchitectures=@@android.reactNativeArchitectures@@ \
# @endif
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/throwaway.keystore" \
            -Pandroid.injected.signing.store.password="$throwaway_pw" \
            -Pandroid.injected.signing.key.alias=throwaway \
            -Pandroid.injected.signing.key.password="$throwaway_pw"
# @if isReactNative
          ccache --show-stats || true
# @endif

      - name: Collect the build outputs
        run: |
          mkdir -p build/android
          cp @@sh:android.aab@@ build/android/app-release.aab
          outputs="$(dirname "$(dirname "$(dirname @@sh:android.aab@@)")")"
          if [[ -f "$outputs/mapping/release/mapping.txt" ]]; then cp "$outputs/mapping/release/mapping.txt" build/android/; fi
          if [[ -f "$outputs/native-debug-symbols/release/native-debug-symbols.zip" ]]; then cp "$outputs/native-debug-symbols/release/native-debug-symbols.zip" build/android/; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ needs.resolve.outputs.build_number }}
          path: build/android
          retention-days: 14
          if-no-files-found: error

  # A fresh runner: signs the bundle with the upload key using the JDK's jarsigner, checks the
  # signature, and uploads it. No dependency code runs here.
  android-release:
    name: Android -> Google Play
    needs: [gate, resolve, android-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '@@javaVersion@@'

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '@@rubyVersion@@'
          bundler-cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-${{ needs.resolve.outputs.build_number }}
          path: build/android

      # Passwords reach keytool and jarsigner through their :env options, never as arguments.
      # The keystore exists only inside this step.
      - name: Sign the bundle with the upload key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for s in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!s}" ]]; then echo "::error::The $s secret is empty. Run .github/mobile-cicd/setup-secrets.sh android"; exit 1; fi
          done
          keypass_var=ANDROID_KEY_PASSWORD
          if [[ -z "${!keypass_var}" ]]; then keypass_var=ANDROID_KEYSTORE_PASSWORD; fi

          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          ks="$dir/upload.keystore"
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$ks"
          aab=build/android/app-release.aab

          # Remove the throwaway signature, so the upload key is the bundle's only signer.
          mapfile -t old_signature < <(unzip -Z1 "$aab" | grep -E '^META-INF/([^/]+\.(SF|RSA|DSA|EC)|MANIFEST\.MF)$' || true)
          if ((${#old_signature[@]})); then zip -q -d "$aab" "${old_signature[@]}"; fi

          key_info="$(keytool -list -v -keystore "$ks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS")"
          sigalg=()
          case "$key_info" in
            *"-bit RSA key"*) sigalg=(-sigalg SHA256withRSA) ;;
            *"-bit EC"*) sigalg=(-sigalg SHA256withECDSA) ;;
          esac
          jarsigner -keystore "$ks" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env "$keypass_var" \
            -digestalg SHA-256 "${sigalg[@]}" "$aab" "$ANDROID_KEY_ALIAS" >/dev/null

          # A bundle signed with any other key is refused by Google Play, but only after the
          # upload. Catch it here with a clear message instead.
          want="$(awk '$1 == "SHA256:" {print $2; exit}' <<<"$key_info")"
          got="$(keytool -printcert -jarfile "$aab" | awk '$1 == "SHA256:" {print $2; exit}')"
          if [[ -z "$want" || "$want" != "$got" ]]; then
            echo "::error::The bundle is not signed with the upload key (expected SHA-256 $want, found ${got:-none})."
            exit 1
          fi
          echo "Signed with the upload key (SHA-256 $got)."

      - name: Upload to Google Play (production)
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ needs.resolve.outputs.build_number }}-signed
          path: build/android/app-release.aab
          retention-days: 14
          if-no-files-found: ignore
